name: Build desktop app

# Builds the Meeting Solo Windows installer with electron-builder and uploads it
# as a downloadable artifact, so you don't have to build locally.

on:
  # Build automatically when the app code changes on the working branch.
  push:
    branches:
      - claude/interview-meeting-transcription-zcm71u
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "worker.js"
      - "electron/**"
      - "vendor/**"
      - "package.json"
      - ".github/workflows/build-desktop.yml"
  # Also build when a GitHub Release is published.
  release:
    types: [published]
  # Or trigger manually from the Actions tab.
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win
        env:
          # Don't attempt code signing in CI (unsigned build).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: meeting-solo-windows
          path: |
            dist/*.exe
          if-no-files-found: error
